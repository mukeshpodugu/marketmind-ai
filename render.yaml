services:
  - type: web
    name: marketmind-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: marketmind-db
          property: connectionString

databases:
  - name: marketmind-db
    databaseName: marketmind_db
    user: postgres
    plan: free
